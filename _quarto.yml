project:
  type: book
  output-dir: docs
  preview:
    port: 4200
    browser: true
    
    
lang: es
toc-title: "Tabla de contenido"
cover-image: cover.png

book:
  title: "Estadística Experiencial Aplicada"
  subtitle: "Aprendizaje práctico de la estadística descriptiva con R"
  author:
    - "Francisco Javier León"
    - "Miguel Oswaldo Pérez Pulido"
    - "Leonardo Andrés Pinto Guarguatí"
  date: "2026-03-24"
  

  site-url: "https://udesanalitica.github.io/estadistica-experiencial/"
  repo-url: "https://github.com/udesanalitica/estadistica-experiencial"
  repo-branch: main
  repo-actions: [edit, issue, source]

  page-navigation: true
  search: true
  downloads: [pdf, epub]

  chapters:
    - index.qmd
    - intro.qmd
    - autores.qmd
    - 01-fundamentos.qmd
    - 02-preparacion-datos.qmd
    - 03-tablas-frecuencia.qmd
    - 04-visualizacion.qmd
    - 05-tendencia-central.qmd
    - 06-posicion.qmd
    - 07-analisis-bivariado.qmd
    - 08-ia.qmd
    - licencia.qmd
    - reproducibilidad.qmd
    - como-usar.qmd
    - contribuir.qmd
    - referencias.qmd

bibliography: references.bib
csl: apa.csl

format:
  html:
    theme: cosmo
    toc: true
    number-sections: true
    code-copy: true
    smooth-scroll: true
    toc-depth: 3
    css: styles.css

  pdf:
    documentclass: report
    pdf-engine: xelatex
    toc: true
    number-sections: true
    mainfont: "Times New Roman"
    geometry:
    - top=2.2cm
    - bottom=2.5cm
    - left=2.5cm
    - right=2.5cm

  epub:
    cover-image: cover.png

website:
  page-footer:
    left: "© 2026 Autores"
    right: "Publicado con Quarto y GitHub Pages"

execute:
  freeze: auto
  warning: false
  message: false

editor: visual